services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: manthan
      POSTGRES_USER: manthan
      POSTGRES_PASSWORD: manthan_dev_password
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manthan -d manthan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://manthan:manthan_dev_password@db:5432/manthan
    ports: ["8000:8000"]
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres_data:
